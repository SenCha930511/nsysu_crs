<html><head><meta http-equiv="Content-Type" content="text/html; charset=big5">
<script language="JavaScript">
function check(f){
  for (i=1;i<=10;i++){
    if (eval("f.D"+i+".value")!="N" && eval("f.C"+i+".value")==""){
      alert("第"+i+"列課號未填"); return false;
    }
  }
  for (i=1;i<=10;i++){
    for (j=i+1;j<=10;j++){
      if (eval("f.T"+i+".value")!="" && eval("f.T"+i+".value")==eval("f.T"+j+".value")){
        alert("志願序重複"); return false;
      }
    }
  }
  return true;
}
</script>
