[project]
name = "nsysu-crs-backend"
version = "0.1.0"
description = "NSYSU course-selection wrapper backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "asyncpg>=0.30",
    "redis>=5.2",
    "anyio>=4.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "httpx>=0.28",
    "ddddocr==1.6.1",
    "beautifulsoup4>=4.15.0",
    "croniter>=6.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",  # test-only: starlette TestClient transport; the selcrs adapter arrives in todo 3
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "provisional: pins the superseded provisional 7-column slt_result layout (todo-4 provisional fixture; the real layout is 14-column per verified-facts (c))",
]
