# Production stack: caddy (frontend + TLS entry), FastAPI app, worker,
# Postgres, Redis. Dev overrides live in docker-compose.dev.yml.
#
# Hardening invariants (todo 17; deviating = plan change):
# - Only caddy publishes ports, exactly 80 (+443 reserved for the VPS domain;
#   the shipped Caddyfile serves :80 only, so 443 accepts nothing locally).
#   To reach a backend service ad hoc from the host, use the override snippet
#   in docs/runbook.md (`app` debugging) - never commit a published port.
# - app/worker/caddy run as non-root users (baked into their images);
#   postgres/redis already drop to their own non-root daemon users via the
#   official entrypoints.
name: nsysu-crs

services:
  app:
    build: ../backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      TZ: Asia/Taipei
    # No published port: only Caddy talks to the app (internal network).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: ../backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      TZ: Asia/Taipei
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nsysu_crs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nsysu_crs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    # Credentials (selcrs cookies) and write-queue keys live here: noeviction
    # only. volatile-* / allkeys-* policies are FORBIDDEN for this instance -
    # they would silently evict credential/queue keys (see plan todo 1 / runbook).
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    environment:
      TZ: Asia/Taipei
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
    # The image runs as uid 10002; this sysctl lets a non-root process bind 80/443.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
